# Huddle party vault (programs/huddle_vault). Devnet only.
# Built artifact: target/deploy/huddle_vault.so (anchor build, Anchor 1.2.2). The site talks to it from
# web/lib/vault.ts; web/scripts/solana-go-live.mjs deploys it to devnet; web/test/vault-localnet.e2e.mts runs a
# whole party against it on solana-test-validator. The IDL is kept in programs/huddle_vault/idl/.
[toolchain]
anchor_version = "1.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
huddle_vault = "GRpABdrQhDya9n2zuf19w2idbL3CRSqmWYTJs52taRHu"

[programs.devnet]
huddle_vault = "GRpABdrQhDya9n2zuf19w2idbL3CRSqmWYTJs52taRHu"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
